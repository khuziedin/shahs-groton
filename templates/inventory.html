<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shah's Inventory</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#14110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#14110e; --panel:#1e1a16; --panel2:#262019; --line:#352d25;
  --fg:#f1e9df; --muted:#a9a093; --faint:#786d60;
  --flame:#e8591f; --flame2:#f0712f; --ink:#14110e;
  --shahs:#d9534a; --rd:#4a93c7; --pfg:#a579d8; --other:#8a8075;
  --ok:#43b074; --order:#e0a63f; --out:#e4514b;
  --disp:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-text-size-adjust:100%}
body{overflow-y:auto;overflow-x:hidden}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700}
button{font-family:var(--body);cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:30;background:var(--flame);color:var(--ink);
  padding:10px max(14px,env(safe-area-inset-left,0)) 10px max(14px,env(safe-area-inset-right,0));
  padding-top:max(10px,env(safe-area-inset-top,0));display:flex;align-items:center;justify-content:space-between;gap:10px}
header .ttl{font-family:var(--disp);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.5px;line-height:1}
header .sub{font-size:12px;font-weight:600;opacity:.85}
header a.back{color:var(--ink);background:rgba(0,0,0,.14);border-radius:9px;padding:8px 12px;text-decoration:none;font-weight:700;font-size:13px}

.wrap{max-width:860px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-left,0)) 140px max(14px,env(safe-area-inset-right,0))}

/* gate */
.gate{max-width:380px;margin:12vh auto 0;text-align:center;padding:0 16px}
.gate .lock{font-size:40px}
.gate h2{font-size:24px;margin:10px 0 6px}
.gate p{color:var(--muted);font-size:14px;margin:0 0 18px}
.gate input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--fg);
  font-size:22px;text-align:center;letter-spacing:.2em;padding:14px;font-family:var(--mono)}
.gate .msg{color:var(--out);font-size:13px;min-height:18px;margin-top:8px;font-weight:600}

.btn{background:var(--flame);color:var(--ink);border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:700;letter-spacing:.2px}
.btn.block{width:100%;margin-top:14px}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45}

/* meta */
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.fld input{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--fg);font-size:15px;padding:9px 11px}
.fld.name{flex:1 1 140px}
.deadline{background:#3a2a12;color:var(--order);border:1px solid #574016;border-radius:9px;padding:8px 11px;font-size:13px;font-weight:700}

.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);font-size:16px;padding:11px 13px;margin-bottom:9px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:6px}
.chip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:6px}
.toggle input{width:18px;height:18px;accent-color:var(--flame)}

.cathead{font-family:var(--disp);font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);font-weight:700;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.prog{color:var(--muted);font-size:12px;font-weight:600;margin-bottom:8px}

.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px}
.item.s-out{border-left-color:var(--out)}
.item.s-order{border-left-color:var(--order)}
.item.s-ok{border-left-color:var(--ok)}
.imain{flex:1;min-width:0}
.inm{font-weight:600;font-size:15px;line-height:1.2}
.isub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.vtag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:5px;color:#fff}
.vtag.shahs{background:var(--shahs)}.vtag.rd{background:var(--rd)}.vtag.pfg{background:var(--pfg)}.vtag.other{background:var(--other)}
.code{font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:1px 5px;border-radius:4px}
.u{font-size:12px;color:var(--muted)}
.iright{display:flex;align-items:center;gap:9px;flex-shrink:0}
.sugg{text-align:right;min-width:48px}
.sugg .lab{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:800}
.sugg .val{font-family:var(--disp);font-size:20px;font-weight:800;line-height:1}
.sugg .val.out{color:var(--out)}.sugg .val.order{color:var(--order)}.sugg .val.ok{color:var(--ok)}.sugg .val.none{color:var(--faint);font-size:15px}
.pn{font-size:10px;color:var(--faint)}
.step{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{width:40px;height:46px;background:transparent;border:0;font-size:24px;color:var(--flame2);font-weight:700;line-height:1}
.step button:active{background:var(--line)}
.step input{width:46px;height:46px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:18px;font-weight:700;background:var(--panel);color:var(--fg);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input.empty{color:var(--faint)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);
  padding:10px max(12px,env(safe-area-inset-left,0)) calc(10px + env(safe-area-inset-bottom,0)) max(12px,env(safe-area-inset-right,0));
  display:flex;align-items:center;gap:12px}
.bar .counts{display:flex;gap:14px;flex:1;min-width:0;overflow:hidden}
.cnt{display:flex;flex-direction:column;line-height:1.1}
.cnt .n{font-family:var(--disp);font-size:19px;font-weight:800}
.cnt .l{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
.cnt.shahs .n{color:var(--shahs)}.cnt.rd .n{color:var(--rd)}.cnt.pfg .n{color:var(--pfg)}

/* review */
.vb{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.vh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;color:#fff}
.vh.shahs{background:var(--shahs)}.vh.rd{background:var(--rd)}.vh.pfg{background:var(--pfg)}.vh.other{background:var(--other)}
.vh h3{font-size:16px;text-transform:uppercase;letter-spacing:.4px}
.vh .cz{font-size:11px;opacity:.9;display:block}
.vh .est{font-size:13px;font-weight:700;opacity:.95}
.rl{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.rl .rn{flex:1;min-width:0}
.rl .nm{font-weight:600;font-size:14px}
.rl .mt{font-size:11px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.badge{font-size:10px;font-weight:800;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.badge.out{background:#3a1f1f;color:var(--out)}
.rq{display:flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px}
.rq button{width:34px;height:40px;border:0;background:transparent;color:var(--flame2);font-size:20px;font-weight:700}
.rq input{width:42px;height:40px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-weight:700;font-size:16px;background:var(--panel);color:var(--fg);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.rq input::-webkit-outer-spin-button,.rq input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.commentbox{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);font-size:15px;padding:11px;font-family:var(--body);resize:vertical;min-height:64px;margin-bottom:10px}
.sec-title{font-family:var(--disp);font-size:22px;font-weight:800;margin-bottom:3px}
.sec-desc{color:var(--muted);font-size:13px;margin-bottom:14px}
.empty{color:var(--muted);font-size:14px;padding:14px 0}

/* done */
.done{max-width:460px;margin:8vh auto 0;text-align:center;padding:0 16px}
.done .big{font-size:52px}
.done h2{font-size:26px;margin:8px 0 6px}
.done p{color:var(--muted);font-size:14px}
pre.out{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--fg);text-align:left;max-height:40vh;overflow:auto;margin-top:14px}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(18px);background:#fff;color:#14110e;padding:11px 18px;border-radius:22px;font-weight:700;font-size:14px;z-index:60;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div><div class="ttl">Inventory</div><div class="sub" id="storeSub">Shah's Groton</div></div>
  <a class="back" href="/">← Time Clock</a>
</header>

<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="/static/inventory.js"></script>
</body>
</html>
